<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PK赛实时通报</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; min-height: 100vh; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 16px; }
.spinner { width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: #9ca3af; font-size: 14px; }
.error-card { margin: 20px 16px; background: white; border-radius: 12px; padding: 24px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.error-card p { color: #6b7280; font-size: 14px; line-height: 1.6; }
.retry-btn { margin-top: 16px; background: #3b82f6; color: white; border: none; padding: 8px 24px; border-radius: 8px; font-size: 14px; cursor: pointer; }
.retry-btn:active { background: #2563eb; }
</style>
</head>
<body>
<div id="mainContent">
<div class="loading">
<div class="spinner"></div>
<div class="loading-text">loading report data...</div>
</div>
</div>

<script>
var DATA_URL = './data.json';

function loadReport() {
    fetch(DATA_URL + '?t=' + Date.now())
        .then(function(resp) { return resp.json(); })
        .then(function(data) {
            if (data.html) {
                // 直接替换整个页面内容为通报HTML（通报HTML本身是完整页面）
                document.open();
                document.write(data.html);
                document.close();

                // 5分钟后自动刷新
                setTimeout(function() { location.reload(); }, 5 * 60 * 1000);
            } else {
                showNoData();
            }
        })
        .catch(function(err) {
            console.error('Load failed:', err);
            showError(err.message);
        });
}

function showNoData() {
    document.getElementById('mainContent').innerHTML = '<div class="error-card"><p>\u6682\u65e0\u901a\u62a5\u6570\u636e<br><br>\u7cfb\u7edf\u6bcf\u5c0f\u65f6\u81ea\u52a8\u66f4\u65b0<br>\u8bf7\u7a0d\u540e\u518d\u6765\u67e5\u770b</p></div>';
}

function showError(msg) {
    document.getElementById('mainContent').innerHTML = '<div class="error-card"><p>\u52a0\u8f7d\u5931\u8d25<br>' + msg + '</p><button class="retry-btn" onclick="loadReport()">\u91cd\u65b0\u52a0\u8f7d</button></div>';
}

loadReport();
</script>
</body>
</html>
